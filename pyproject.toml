[project]
name = "another-arrow-rt265"
version = "1.0.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "watermelonabc", email = "2172718424@qq.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pygame-ce>=2.5.8",
    "ruff>=0.16.7",
    "ty>=0.0.80",
]

[project.scripts]
another-arrow-rt265 = "another_arrow_rt265:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "nuitka>=4.2.1",
    "pytest>=9.1.1",
    "uv-build>=0.12.13,<0.13.0",
]

# Nuitka 打包配置，执行 `uv run python -m nuitka --project` 打包。
# `--project` 会读取本节与 [project]，自动推断包名、GUI 入口与产物名，
# 因此这里只放“打包策略”，不重复写入口/包名。
[tool.nuitka]
# 生成“独立目录”产物，目标机器无需安装 Python。
standalone = true
# 产物统一落在 build/ 下（已 gitignore），不污染仓库根目录。
output-dir = "build/nuitka"
# 允许 Nuitka 自动下载并缓存辅助工具（首次打包需要 depends.exe 检测 DLL）。
assume-yes-for-downloads = true
# 自带素材（字体）不需要在这里声明：它们放在包内（src/another_arrow_rt265/assets/），
# --project 会自动加 --include-package-data=another_arrow_rt265 把它们搬进产物。
# 反过来，用 include-data-dir 指向包外的目录会被 --project 判为“多余的数据文件”而打包失败
# （uv_build 只会把包内文件与 .data 目录放进 wheel，包外的 assets/ 不在 wheel 里）。
# 游戏是 GUI 程序，运行时不要弹出黑色控制台窗口。
windows-console-mode = "disable"
# 项目未使用这些可选依赖，显式排除以免 Nuitka 反复报告“找不到模块”。
# （anti-bloat 体积优化插件在 Nuitka 中默认启用，无需在此声明。）
nofollow-import-to = [
    "OpenGL",
    "numpy",
    "pygame.docs",
    "pygame.examples",
    "pytest",
    "ruff",
    "ty",
]
