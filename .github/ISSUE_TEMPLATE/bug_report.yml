name: Bug 报告
description: 创建报告以帮助我们改进。
title: "fix: "
labels: [ "bug" ]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: 自查
      description: |
        在提交问题之前，请检查您是否已完成以下操作。
      options:
        - label: 我确认在报告之前我已经搜索了现有 issues，且没有类似问题提出。
          required: true
        - label: 我确认我使用的是最新版本，但这个问题仍然存在。
          required: true
        - label: 我确认我已经检查。如果我不按照说明进行操作，该问题可能会被直接关闭。
          required: true
  - type: input
    id: game_version
    attributes:
      label: 游戏版本
      description: |
        您正在使用的游戏版本版本？
      placeholder: "Example: v4 or commit number"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 描述
      description: |
        请通过清晰详细的描述告诉我们错误是什么、预期行为是什么，添加屏幕截图以帮助解释。
    validations:
      required: true
